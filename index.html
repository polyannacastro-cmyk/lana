<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #ffeef2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .wrapper {
            position: relative;
            width: 300px;
            height: 200px;
            cursor: pointer;
        }
        .envelope {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f3a6b8;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 3; /* Поднимаем конверт над письмом */
        }
        .envelope::before {
            content: '';
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 150px 100px 150px;
            border-color: transparent transparent #f5b3c4 transparent;
            z-index: 3;
        }
        .envelope::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 100px 150px 100px 150px;
            border-color: #f8c2d0 transparent transparent transparent;
            z-index: 4; /* Передние стенки конверта перекрывают всё */
        }
        .flap {
            position: absolute;
            top: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 100px 150px 0 150px;
            border-color: #e68fa3 transparent transparent transparent;
            transform-origin: top;
            transition: transform 0.4s ease, z-index 0.4s;
            z-index: 5; /* Крышка конверта изначально на самом верху */
        }
        .letter {
            position: absolute;
            bottom: 10px; /* Прячем письмо глубже вниз */
            left: 15px;
            width: 270px;
            height: 180px;
            background-color: #ffffff;
            border-radius: 5px;
            padding: 20px;
            transition: transform 0.6s ease, z-index 0.6s;
            z-index: 2; /* Изначально письмо ЗА конвертом */
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .letter-text {
            font-size: 16px;
            color: #4a4a4a;
            line-height: 1.5;
            font-weight: 500;
        }
        .heart {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            background-color: #ff4b72;
            transform: translate(-50%, -20%) rotate(45deg);
            transition: transform 0.4s ease, opacity 0.4s;
            z-index: 6; /* Сердечко-замочек поверх всего */
        }
        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: #ff4b72;
            border-radius: 50%;
        }
        .heart::before { top: -15px; left: 0; }
        .heart::after { left: -15px; top: 0; }

        /* Состояния при активации */
        .wrapper.open .flap {
            transform: rotateX(180deg);
            z-index: 1; /* Откинутая крышка уходит назад */
        }
        .wrapper.open .letter {
            transform: translateY(-130px); /* Письмо вылетает выше */
            z-index: 7; /* И становится над всеми слоями конверта */
            height: auto;
            min-height: 220px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        .wrapper.open .heart {
            opacity: 0;
            transform: translate(-50%, -20%) rotate(45deg) scale(0);
        }

        /* Эффект падающих элементов */
        .particle {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            animation: fall 3s linear forwards;
            opacity: 0;
        }
        @keyframes fall {
            0% { transform: translateY(10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="wrapper" id="envelopeWrapper" onclick="openEnvelope()">
        <div class="flap"></div>
        <div class="envelope"></div>
        <div class="letter">
            <div class="letter-text">
                Света) <br>
                Я просто хочу напомнить, что ты замечательный человек 🤗❤️ Спасибо, что ты есть 😁✨
            </div>
        </div>
        <div class="heart"></div>
    </div>

    <script>
        function openEnvelope() {
            const wrapper = document.getElementById('envelopeWrapper');
            if (!wrapper.classList.contains('open')) {
                wrapper.classList.add('open');
                createParticles();
            }
        }

        function createParticles() {
            const symbols = ['❤️', '🤗', '🥰', '😈'];
            for (let i = 0; i < 40; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.bottom = '0px';
                particle.style.animationDelay = Math.random() * 2 + 's';
                particle.style.fontSize = Math.random() * 20 + 16 + 'px';
                document.body.appendChild(particle);
                
                setTimeout(() => { particle.remove(); }, 5000);
            }
        }
    </script>
</body>
</html>
